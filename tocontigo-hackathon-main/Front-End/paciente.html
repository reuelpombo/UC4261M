<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TôContigo • WhatsApp do Paciente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f8f9; }
    .wa-bg {
      background-color: #efeae2;
      background-image: radial-gradient(#d5cfc4 0.85px, transparent 0.85px);
      background-size: 18px 18px;
    }
    .scrollbar-thin::-webkit-scrollbar { width: 5px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4 text-slate-800">

  <!-- Cabeçalho -->
  <header class="w-full max-w-md flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#0f4c5c] to-[#14b8a6] flex items-center justify-center text-white shadow">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v4m-2-2h4" />
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-extrabold text-[#0f4c5c] leading-none">TôContigo</h1>
        <p class="text-xs text-slate-500 mt-1">Visão do Cidadão • WhatsApp SUS</p>
      </div>
    </div>
    <a href="ubs.html" target="_blank" class="text-xs font-semibold text-[#0f4c5c] bg-teal-50 border border-teal-200 px-3 py-1.5 rounded-lg hover:bg-teal-100 transition">
      Abrir Painel UBS ↗
    </a>
  </header>

  <!-- Cenários Rápidos do Pitch -->
  <section class="w-full max-w-md bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/80 mb-5">
    <div class="flex items-center justify-between mb-2.5">
      <span class="text-[11px] font-bold uppercase tracking-wider text-[#0f4c5c] flex items-center gap-1.5">
        <span class="text-teal-500">▷</span> Cenários Rápidos do Pitch
      </span>
      <span class="text-[11px] text-slate-400">Clique para simular etapa</span>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <button onclick="executarEtapa(1)" class="text-left p-2.5 rounded-xl border border-slate-200 hover:border-teal-400 hover:bg-teal-50/40 transition">
        <div class="text-[10px] font-bold text-teal-600 uppercase">Etapa 1</div>
        <div class="text-xs font-semibold text-slate-700">Identificação & LGPD</div>
      </button>
      <button onclick="executarEtapa(2)" class="text-left p-2.5 rounded-xl border border-slate-200 hover:border-teal-400 hover:bg-teal-50/40 transition">
        <div class="text-[10px] font-bold text-teal-600 uppercase">Etapa 2</div>
        <div class="text-xs font-semibold text-slate-700">Foto Receita & Lembrete</div>
      </button>
      <button onclick="executarEtapa(3)" class="text-left p-2.5 rounded-xl border border-slate-200 hover:border-teal-400 hover:bg-teal-50/40 transition">
        <div class="text-[10px] font-bold text-teal-600 uppercase">Etapa 3</div>
        <div class="text-xs font-semibold text-slate-700">Pressão & Relato UBS</div>
      </button>
      <button onclick="executarEtapa(4)" class="text-left p-2.5 rounded-xl border border-slate-200 hover:border-rose-300 hover:bg-rose-50/40 transition">
        <div class="text-[10px] font-bold text-rose-500 uppercase">Etapa 4</div>
        <div class="text-xs font-semibold text-slate-700">Dúvida vs. Alerta SAMU</div>
      </button>
    </div>
  </section>

  <!-- Moldura do Smartphone -->
  <main class="w-full max-w-[380px] bg-slate-900 rounded-[44px] p-3 shadow-2xl border-4 border-slate-800">
    <div class="bg-white rounded-[34px] overflow-hidden flex flex-col h-[640px]">
      
      <!-- Barra de Status -->
      <div class="bg-[#075e54] text-white text-[11px] font-semibold px-6 pt-2.5 pb-1 flex justify-between items-center">
        <span id="relogio-celular">09:41</span>
        <div class="w-20 h-4 bg-slate-900 rounded-full"></div>
        <span>5G 100%</span>
      </div>

      <!-- Topo do WhatsApp -->
      <div class="bg-[#075e54] text-white px-4 py-2.5 flex items-center gap-3 shadow-sm">
        <div class="w-9 h-9 rounded-full bg-teal-600 border border-teal-300/40 flex items-center justify-center relative">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
          </svg>
          <span class="w-2.5 h-2.5 bg-emerald-400 rounded-full absolute bottom-0 right-0 border-2 border-[#075e54]"></span>
        </div>
        <div class="flex-1">
          <div class="flex items-center gap-1 font-bold text-sm">
            TôContigo • SUS
            <span class="text-emerald-300 text-xs">✔</span>
          </div>
          <p class="text-[11px] text-teal-100">online • Assistente Oficial de Saúde</p>
        </div>
      </div>

      <!-- Área de Mensagens -->
      <div id="chat-messages" class="flex-1 wa-bg p-3.5 overflow-y-auto space-y-3 scrollbar-thin text-[13px]"></div>

      <!-- Input de Mensagem -->
      <form onsubmit="enviarMensagemUsuario(event)" class="bg-[#f0f2f5] px-3 py-2.5 flex items-center gap-2 border-t border-slate-200">
        <input
          id="user-input"
          type="text"
          placeholder="Digite uma mensagem..."
          class="flex-1 bg-white rounded-full px-4 py-2 text-xs text-slate-700 focus:outline-none shadow-sm"
        />
        <button type="submit" class="w-9 h-9 rounded-full bg-[#008069] hover:bg-[#006a57] text-white flex items-center justify-center shadow transition">
          <svg class="w-4 h-4 translate-x-0.5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
          </svg>
        </button>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    iniciarVisaoPaciente();
  </script>
</body>
</html>
